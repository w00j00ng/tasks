version: '3'

tasks:
  security:test:
    dir: '{{.ROOT_DIR}}'
    desc: Verify security reporting and scanner classification without GitHub access
    cmds:
      - |
        set -euo pipefail
        # 요청: 소비 저장소 루트에서 테스트 호출. 기대: 실제 작업 디렉터리가 ROOT_DIR와 일치.
        if [ "$(pwd)" != "$(cd {{.ROOT_DIR | shellQuote}} && pwd)" ]; then
          echo 'security:test must run in ROOT_DIR' >&2
          exit 1
        fi
        case "${OS:-}" in
          Windows_NT) tmp=$(mktemp -d -p "$(pwd -P)" .security-test.XXXXXXXX) ;;
          *) tmp=$(mktemp -d "$(pwd -P)/.security-test.XXXXXXXX") ;;
        esac
        fixture="$tmp/state.json"
        log="$tmp/log"
        trap 'rm -f "$fixture" "$log" "$tmp/result.json" "$tmp/scanner.json" "$tmp/scanner-output" "$tmp/Taskfile.entry.yml"; rmdir "$tmp/module" 2>/dev/null || true; rmdir "$tmp"' EXIT
        export GITHUB_EVENT_NAME=schedule GITHUB_REF=refs/heads/main
        export GITHUB_API_URL=https://api.github.com GITHUB_SERVER_URL=https://github.com
        export GITHUB_REPOSITORY=w00j00ng/goproj GITHUB_RUN_ID=123 GITHUB_RUN_ATTEMPT=2
        export GH_TOKEN=test-token
        reset() {
          jq -n '{run: {run_number: 10, event: "schedule", head_branch: "main", head_sha: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa",
            created_at: "2026-11-06T22:23:00Z"}, jobs: [{id: 1, run_attempt: 2, name: "dependency-scan (bcrypter)", status: "completed",
            conclusion: "failure", html_url: "https://github.com/w00j00ng/goproj/actions/runs/123/job/bcrypter",
            steps: [{name: "Fail for reachable vulnerabilities", conclusion: "failure"}]}],
            artifacts: [], issues: [], comments: [], requests: [], fail_method: "", fail_path: ""}' > "$fixture"
        }
        change() {
          updated=$(jq "$@" "$fixture")
          printf '%s\n' "$updated" > "$fixture"
        }
        check() {
          jq -e "$1" "$fixture" > /dev/null || { printf 'FAIL: %s\n' "$1"; cat "$fixture"; cat "$log"; exit 1; }
        }
        # gh is the API boundary; unexpected requests fail instead of reaching GitHub.
        gh() {
          if [ "$1 $2" = 'run download' ]; then
            shift 2
            test "$1" = "$GITHUB_RUN_ID"; shift
            test "$1" = --repo; test "$2" = "$GITHUB_REPOSITORY"; shift 2
            test "$1" = --name; artifact_name=$2; shift 2
            test "$1" = --dir; download_dir=$2
            change --arg name "$artifact_name" '.requests += [{method: "DOWNLOAD", path: $name}]'
            if jq -e '.download_failure == true' "$fixture" > /dev/null; then return 1; fi
            if jq -e --arg name "$artifact_name" '.artifacts[] | select(.name == $name) | .corrupt == true' "$fixture" > /dev/null; then
              printf '{' > "$download_dir/security-result.json"
            else
              jq --arg name "$artifact_name" '.artifacts[] | select(.name == $name) | .result' "$fixture" > "$download_dir/security-result.json"
            fi
            if jq -e '.multiple_results == true' "$fixture" > /dev/null; then
              original=$(cat "$download_dir/security-result.json")
              printf '{}\n%s\n' "$original" > "$download_dir/security-result.json"
            fi
            if jq -e --arg name "$artifact_name" '.extra_file == true or any(.artifacts[]; .name == $name and .extra_file == true)' "$fixture" > /dev/null; then
              printf 'unexpected' > "$download_dir/extra.txt"
            fi
            return
          fi
          endpoint=${2#"$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/"}
          method=$4
          change --arg method "$method" --arg path "$endpoint" '.requests += [{method: $method, path: $path}]'
          if jq -e --arg method "$method" --arg path "$endpoint" \
            '.fail_method == $method and (.fail_path == "" or .fail_path == $path)' "$fixture" > /dev/null; then
            printf 'HTTP Error 503\n' >&2
            return 1
          fi
          case "$method $endpoint" in
            'GET actions/runs/'"$GITHUB_RUN_ID"'/jobs?filter=all&per_page=100'|'GET actions/runs/'"$GITHUB_RUN_ID"'/artifacts?per_page=100'|'GET issues?state=all&creator=github-actions%5Bbot%5D&per_page=100'|'GET issues/'*'/comments')
              for option in --paginate --slurp; do
                case " $* " in
                  *" $option "*) ;;
                  *) printf 'Missing API option: %s\n' "$option" >&2; return 1 ;;
                esac
              done ;;
          esac
          case "$method $endpoint" in
            'GET actions/runs/'"$GITHUB_RUN_ID") jq .run "$fixture" ;;
            'GET actions/runs/'"$GITHUB_RUN_ID"'/jobs?filter=all&per_page=100')
              jq '[range(0; (.jobs | length); 100) as $i | {jobs: .jobs[$i:$i+100]}]' "$fixture" ;;
            'GET actions/runs/'"$GITHUB_RUN_ID"'/artifacts?per_page=100')
              jq '[{artifacts: .artifacts}]' "$fixture" ;;
            'GET issues?state=all&creator=github-actions%5Bbot%5D&per_page=100')
              jq '.issues | [range(0; length; 100) as $i | .[$i:$i+100]]' "$fixture" ;;
            'GET issues/'*'/comments')
              number=${endpoint#issues/}; number=${number%/comments}
              jq --argjson number "$number" '[.comments[] | select(.issue_number == $number)] |
                [range(0; length; 100) as $i | .[$i:$i+100]]' "$fixture" ;;
            'POST issues')
              payload=$(cat)
              change --argjson payload "$payload" '.issues += [($payload + {number: (([.issues[].number,41] | max) + 1),
                state: "open", user: {login: "github-actions[bot]"}})]'
              jq '.issues[-1]' "$fixture" ;;
            'PATCH issues/'*)
              number=${endpoint#issues/}; payload=$(cat)
              if jq -e --argjson number "$number" '.close_before_patch == $number' "$fixture" > /dev/null; then
                change --argjson number "$number" '(.issues[] | select(.number == $number)).state = "closed" | .close_before_patch = null'
              fi
              if jq -e --argjson payload "$payload" '.fail_finalize == true and
                ($payload.body | contains("<!-- dependency-security-pending:") | not)' "$fixture" > /dev/null; then
                printf 'HTTP Error 503\n' >&2
                return 1
              fi
              change --argjson number "$number" --argjson payload "$payload" \
                '(.issues[] | select(.number == $number)) += $payload'
              jq --argjson number "$number" '.issues[] | select(.number == $number)' "$fixture" ;;
            'POST issues/'*'/comments')
              number=${endpoint#issues/}; number=${number%/comments}; payload=$(cat)
              change --argjson number "$number" --argjson payload "$payload" \
                '.comments += [($payload + {issue_number: $number, user: {login: "github-actions[bot]"}})]'
              printf '{}\n' ;;
            *) printf 'Unexpected API request: %s %s\n' "$method" "$endpoint" >&2; return 1 ;;
          esac
        }
        report() {
        {{.SECURITY_REPORT | indent 2}}
        }
        invoke() {
          expected=$1
          set +e
          (set +u; set +o pipefail; set -e; report) > "$log" 2>&1
          result=$?
          set -e
          if [ "$result" -ne "$expected" ]; then
            cat "$log"
            cat "$fixture"
            printf 'Expected exit %s; got %s\n' "$expected" "$result"
            exit 1
          fi
        }
        # 요청: main 정기 취약점 발견 + 다른 모듈 오류. 기대: 이슈/멘션 1건, 모듈·커밋·로그와 판정 불가 표시.
        reset
        change '.jobs += [(.jobs[0] | .name = "dependency-scan (scrypter)" | .steps[0].conclusion = "skipped")]'
        invoke 0
        check '(.issues | length) == 1 and (.comments | length) == 1 and
          (.issues[0].body | contains("dependency-security-issue:v1") and
          contains("dependency-security-source:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa:123") and contains("bcrypter") and
          contains("/job/bcrypter") and contains("aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa") and contains("scrypter")) and
          (.comments[0].body | contains("@w00j00ng") and contains("2026-11-07"))'
        echo 'PASS 1: finding creates one issue and one mention'

        # 요청: 같은 날 재실행 후 다음 날 발견. 기대: 동일 이슈 최신화, 날짜별 댓글 1건.
        reset; invoke 0
        change '.jobs[0].name = "dependency-scan (helloworld)"'
        invoke 0
        check '(.issues | length) == 1 and (.comments | length) == 1 and
          (.issues[0].body | contains("helloworld") and (contains("dependency-scan (bcrypter)") | not) and
          (contains("검사 오류") | not))'
        change '.run.created_at = "2026-11-07T22:23:00Z" | .run.run_number += 1'
        GITHUB_RUN_ID=124 invoke 0
        check '(.issues | length) == 1 and (.comments | length) == 2 and
          (.issues[0].body | contains("dependency-security-source:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa:124"))'
        echo 'PASS 2: unresolved findings notify again on the next scheduled date'

        # 요청: 기존 이슈 닫은 뒤 발견. 기대: 닫힌 기록 보존, 새 이슈/댓글 생성.
        reset; invoke 0
        change '.issues[0].state = "closed"'
        closed=$(jq -c .issues[0] "$fixture")
        change '.run.run_number += 1'
        GITHUB_RUN_ID=124 invoke 0
        check "(.issues | length) == 2 and .issues[0] == $closed and .issues[1].number == 43 and
          .issues[1].state == \"open\" and (.comments | length) == 2 and .comments[1].issue_number == 43"
        echo 'PASS 3: closed issue preserved'

        # 요청: 정상·분석 오류·취소. 기대: 이슈/댓글 쓰기 없음.
        for conclusion in success failure cancelled; do
          reset
          change --arg conclusion "$conclusion" '.jobs[0].conclusion = $conclusion | .jobs[0].steps[0].conclusion = "skipped"'
          invoke 0
          check '(.issues | length) == 0 and (.comments | length) == 0 and all(.requests[]; .method == "GET")'
        done
        echo 'PASS 4: clean scans and execution errors excluded'

        # 요청: PR·수동·push·다른 브랜치. 기대: API 호출 없음.
        for event in pull_request workflow_dispatch push; do
          reset
          GITHUB_EVENT_NAME=$event invoke 0
          check '(.requests | length) == 0'
        done
        reset
        GITHUB_REF=refs/heads/feature invoke 0
        check '(.requests | length) == 0'
        echo 'PASS 5: events and branches excluded'

        # 요청: 이슈/당일 댓글이 두 번째 페이지에 존재. 기대: 재사용, 중복 생성 없음.
        reset; invoke 0
        change '.jobs = ([range(100) | {id: (100 + .), run_attempt: 2, name: ("dependency-scan (clean-" + tostring + ")"),
            status: "completed", conclusion: "success", steps: []}] + .jobs) |
          .issues = ([range(100) | {number: (100 + .), state: "open", body: "other", user: {login: "github-actions[bot]"}}] + .issues) |
          .comments = ([range(100) | {issue_number: 42, body: "other", user: {login: "github-actions[bot]"}}] + .comments)'
        invoke 0
        check '(.issues | length) == 101 and (.comments | length) == 101'
        echo 'PASS 6: paginated issues and comments'

        # 요청: 환경변수와 실제 실행 정보 불일치. 기대: 이슈/댓글 쓰기 없음.
        for field in event head_branch; do
          reset
          change --arg field "$field" '.run[$field] = "other"'
          invoke 0
          check '(.issues | length) == 0 and (.comments | length) == 0 and all(.requests[]; .method == "GET")'
        done
        echo 'PASS 7: run metadata checked'

        # 요청: 본문 갱신 API 실패. 기대: 작업 실패, 알림 댓글 없음.
        reset; invoke 0
        change '.comments = [] | .fail_method = "PATCH"'
        invoke 1
        check '(.comments | length) == 0'
        grep -q 'HTTP Error 503' "$log"
        if grep -q "$GH_TOKEN" "$log"; then echo 'Token leaked to log'; exit 1; fi
        echo 'PASS 8: update failure prevents notification'

        # 요청: 이슈 생성 후 댓글 실패, 재실행. 기대: 이슈 재사용, 댓글 1건.
        reset
        change '.fail_method = "POST" | .fail_path = "issues/42/comments"'
        invoke 1
        check '(.issues | length) == 1 and (.comments | length) == 0'
        grep -q 'HTTP Error 503' "$log"
        change '.fail_method = ""'
        GITHUB_RUN_ATTEMPT=3 invoke 0
        check '(.issues | length) == 1 and (.comments | length) == 1'
        echo 'PASS 9: report-only retry reuses previous scan and issue'

        # 요청: JSON 모드 종료 0에도 발견 수준을 구분. 기대: symbol만 실패, package/module은 경고.
        scan() {
        {{.SECURITY_SCAN | indent 2}}
        }
        govulncheck() {
          test "$*" = '-json -test ./...'
          cat "$tmp/scanner.json"
          return "$scanner_status"
        }
        go_env_failure=false
        go() {
          if [ "$go_env_failure" = true ]; then return 2; fi
          command go "$@"
        }
        export SECURITY_RESULT_FILE="$tmp/result.json" SECURITY_SCAN_KEY=go-bcrypter-windows-cgo0 SECURITY_MODULE=bcrypter
        for scenario in symbol package module clean strongest malformed empty config mode sbom; do
          scanner_status=0
          jq -n '{config: {protocol_version: "v1.0.0", scanner_name: "govulncheck", scanner_version: "v1.9.0", scan_level: "symbol", scan_mode: "source"}},
            {SBOM: {go_version: "go1.27.4", modules: [], roots: ["example.com/app"]}}' > "$tmp/scanner.json"
          case "$scenario" in
            symbol|package|module|strongest)
              jq -n --arg scenario "$scenario" '{finding: {osv: "GO-2026-0001", fixed_version: "v1.2.3", trace: [
                ({module: "example.com/dep", version: "v1.0.0"} +
                  (if $scenario == "module" then {} else {package: "example.com/dep/pkg"} end) +
                  (if $scenario == "symbol" or $scenario == "strongest" then {function: "Unsafe"} else {} end))]}}' >> "$tmp/scanner.json"
              if [ "$scenario" = strongest ]; then
                jq -n '{finding: {osv: "GO-2026-0001", fixed_version: "v1.2.3", trace: [{module: "example.com/dep", version: "v1.0.0"}]}}' >> "$tmp/scanner.json"
              fi ;;
            malformed) printf '{' >> "$tmp/scanner.json" ;;
            empty) : > "$tmp/scanner.json" ;;
            config|mode|sbom)
              updated=$(jq --arg scenario "$scenario" 'if $scenario == "sbom" then select(has("SBOM") | not)
                elif has("config") then .config[if $scenario == "mode" then "scan_mode" else "scan_level" end] = "invalid" else . end' "$tmp/scanner.json")
              printf '%s\n' "$updated" > "$tmp/scanner.json" ;;
          esac
          for mode in ci local; do
            : > "$log"
            if [ "$mode" = ci ]; then export GITHUB_OUTPUT="$log"; else unset GITHUB_OUTPUT; fi
            set +e
            (set -e; scan) > "$tmp/scanner-output" 2>&1
            result=$?
            set -e
            expected=0
            case "$scenario" in
              symbol|strongest)
                if [ "$mode" = ci ]; then
                  grep -qx 'vulnerable=true' "$log" || { cat "$tmp/scanner-output"; echo "FAIL: missing symbol CI output ($result)"; exit 1; }
                else expected=3; fi ;;
              malformed|empty|config|mode|sbom) expected=1 ;;
              *) test ! -s "$log" ;;
            esac
            if [ "$result" -ne "$expected" ]; then echo "FAIL scanner $scenario/$mode: expected $expected got $result"; exit 1; fi
            if [ "$expected" -ne 1 ]; then
              jq -e --arg scenario "$scenario" '.schema_version == 1 and .repository == "w00j00ng/goproj" and
                .run_id == 123 and .run_attempt == 2 and .scan_key == "go-bcrypter-windows-cgo0" and .module == "bcrypter" and
                .scan_status == "complete" and .scanner_exit == 0 and .scanner_version == "v1.9.0" and
                (.target.goos | length > 0) and (.go_version | length > 0) and
                (if $scenario == "clean" then .findings == [] else (.findings | length) == 1 and
                .findings[0].level == (if $scenario == "strongest" then "symbol" else $scenario end) and
                .findings[0].fixed_version == "v1.2.3" and
                (if $scenario == "strongest" then (.findings[0].traces | length) == 2 and
                  .findings[0].packages == ["example.com/dep/pkg"] else true end) end)' "$SECURITY_RESULT_FILE" > /dev/null
            else
              jq -e '.scan_status == "error" and .scanner_exit == 0' "$SECURITY_RESULT_FILE" > /dev/null
            fi
          done
        done
        for scanner_status in 1 2 3 127; do
          expected=$scanner_status
          printf '{}\n' > "$tmp/scanner.json"
          for mode in ci local; do
            : > "$log"
            if [ "$mode" = ci ]; then export GITHUB_OUTPUT="$log"; else unset GITHUB_OUTPUT; fi
            set +e
            (set -e; scan) > /dev/null 2>&1
            result=$?
            set -e
            test "$result" -eq "$expected"
            test ! -s "$log"
            jq -e --argjson status "$scanner_status" '.scan_status == "error" and .scanner_exit == $status' "$SECURITY_RESULT_FILE" > /dev/null
          done
        done
        # 요청: Go 환경 조회 실패로 scanner 미실행. 기대: 작업 실패와 scanner_exit null을 기록.
        go_env_failure=true
        set +e
        (set -e; scan) > /dev/null 2>&1
        result=$?
        set -e
        test "$result" -eq 2
        jq -e '.scan_status == "error" and .scanner_exit == null' "$SECURITY_RESULT_FILE" > /dev/null
        go_env_failure=false
        unset SECURITY_RESULT_FILE SECURITY_SCAN_KEY SECURITY_MODULE
        # 요청: 소비 include의 중첩 MODULE에서 실제 스캔 작업 실행. 기대: 모듈 작업 디렉터리에 결과를 쓰고 임시 파일 정리.
        mkdir "$tmp/module"
        export SECURITY_SCANNER_FIXTURE="$(cd "$tmp" && pwd)/scanner.json"
        jq -n '{config: {protocol_version: "v1.0.0", scanner_name: "govulncheck", scanner_version: "v1.9.0", scan_level: "symbol", scan_mode: "source"}},
          {SBOM: {go_version: "go1.27.4", modules: [], roots: ["example.com/app"]}}' > "$SECURITY_SCANNER_FIXTURE"
        scan_source={{.SECURITY_SCAN | shellQuote}}
        entry_scan='govulncheck() { cat "$SECURITY_SCANNER_FIXTURE"; }; '
        # Included Taskfile vars override CLI globals; task-call vars keep this scanner stub local.
        jq -n --arg source {{.TASKFILE_DIR | shellQuote}}/Taskfile.yml --arg scan "$entry_scan$scan_source" \
          '{version: "3", silent: true, includes: {shared: {taskfile: $source, dir: ".", flatten: true}},
            tasks: {entry: {cmds: [{task: "security:scan", vars: {MODULE: "module", SECURITY_SCAN: $scan}}]}}}' > "$tmp/Taskfile.entry.yml"
        CGO_ENABLED=0 task --silent --exit-code --taskfile "$tmp/Taskfile.entry.yml" entry > "$tmp/scanner-output"
        jq -e '.scan_status == "complete" and .target.cgo == "0"' "$tmp/scanner-output" > /dev/null
        for leftover in "$tmp/module"/.security-scan.*; do
          if [ -d "$leftover" ]; then echo "Scanner temp directory leaked: $leftover"; exit 1; fi
        done
        # 요청: 실제 Task 진입점의 명시 CGO 설정과 미설정. 기대: 0/1 상속, 기본값 0.
        for cgo in 0 1 default; do
          if [ "$cgo" = default ]; then
            actual=$(unset CGO_ENABLED; task --silent --taskfile "$tmp/Taskfile.entry.yml" entry)
            expected_cgo=0
          else
            actual=$(CGO_ENABLED=$cgo task --silent --taskfile "$tmp/Taskfile.entry.yml" entry)
            expected_cgo=$cgo
          fi
          test "$(printf '%s' "$actual" | jq -j .target.cgo)" = "$expected_cgo"
        done
        unset SECURITY_SCANNER_FIXTURE
        echo 'PASS 10: scanner classification'

        # 요청: npm 정상/취약점/레지스트리 오류/잘못된 응답. 기대: high·critical만 발견 표시, 오류는 알림 제외.
        scan_npm() {
        {{.SECURITY_NPM | indent 2}}
        }
        npm() {
          test "$*" = 'audit --package-lock-only --include=dev --audit-level=high --registry=https://registry.npmjs.org --json'
          printf '%s' "$npm_response"
          return "$npm_status"
        }
        for scenario in clean low moderate high critical registry malformed other-error; do
          npm_status=0; count=0
          npm_response='{"metadata":{"vulnerabilities":{"high":0,"critical":0}}}'
          case "$scenario" in
            low|moderate) npm_response='{"metadata":{"vulnerabilities":{"high":0,"critical":0,"low":1,"moderate":2}}}' ;;
            high) npm_status=1; count=1; npm_response='{"metadata":{"vulnerabilities":{"high":1,"critical":0}}}' ;;
            critical) npm_status=1; count=1; npm_response='{"metadata":{"vulnerabilities":{"high":0,"critical":1}}}' ;;
            registry) npm_status=1; npm_response='{"error":{"code":"E503"}}' ;;
            malformed) npm_response='not json' ;;
            other-error) npm_status=2 ;;
          esac
          for mode in ci local; do
            : > "$log"
            if [ "$mode" = ci ]; then export GITHUB_OUTPUT="$log"; else unset GITHUB_OUTPUT; fi
            set +e
            (set -e; scan_npm) > "$fixture" 2>&1
            result=$?
            set -e
            if [ "$count" -gt 0 ] && [ "$mode" = ci ]; then
              test "$result" -eq 0
              grep -qx 'vulnerable=true' "$log"
            else
              test ! -s "$log"
              case "$scenario" in
                clean|low|moderate) test "$result" -eq 0 ;;
                *) test "$result" -ne 0 ;;
              esac
            fi
          done
        done
        echo 'PASS 11: npm severity and infrastructure errors'

        # 요청: 다른 저장소의 npm 검사 취약점. 기대: 해당 저장소의 이슈와 실행 링크를 사용.
        unset GITHUB_OUTPUT
        reset
        change '.jobs[0].name = "dependency-scan (npm)"'
        GITHUB_REPOSITORY=w00j00ng/glorycourse invoke 0
        check '(.issues | length) == 1 and (.comments | length) == 1 and
          (.issues[0].body | contains("dependency-scan (npm)")) and
          (.comments[0].body | contains("w00j00ng/glorycourse/actions/runs/123"))'
        echo 'PASS 12: consumer repository isolation'

        # 요청: 소비 저장소에서 API 읽기 실패. 기대: 실패를 전파하고 이슈/댓글 중복 생성 없음.
        for read_endpoint in 'actions/runs/123/jobs?filter=all&per_page=100' 'issues?state=all&creator=github-actions%5Bbot%5D&per_page=100' 'issues/42/comments'; do
          reset; invoke 0
          change --arg endpoint "$read_endpoint" '.fail_method = "GET" | .fail_path = $endpoint'
          invoke 1
          check '(.issues | length) == 1 and (.comments | length) == 1 and
            ([.requests[] | select(.method == "POST")] | length) == 2'
        done
        echo 'PASS 13: API read failures cannot create duplicates'

