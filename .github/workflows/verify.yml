name: Verify shared tasks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: stable
          check-latest: true
          cache: false
      - run: go install github.com/go-task/task/v3/cmd/task@v3.54.0
      - name: Verify shared tasks at repository root
        run: task security:test
      - name: Verify shared tasks through consumer include
        run: |
          consumer_dir=$(mktemp -d)
          trap 'rm -rf "$consumer_dir"' EXIT
          mkdir "$consumer_dir/tasks"
          cp Taskfile.yml Taskfile.test.yml "$consumer_dir/tasks/"
          cat > "$consumer_dir/Taskfile.yml" <<'YAML'
          version: '3'
          includes:
            shared:
              taskfile: ./tasks/Taskfile.yml
              dir: .
              flatten: true
          YAML
          cd "$consumer_dir"
          task security:test
